name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.7'
  JAVA_VERSION: '17'

jobs:
  build:
    name: Flutter Android Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ce94fb0c812a5d7a0b5f7c # v5

      - name: Setup Java
        uses: actions/setup-java@dded4c94c8c5c9c0b7c1d1c7e8f7e0e7b9d8f3d7 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55a5c8f7b5b4c8e0f5e5f0b3f8e5f8f4c0c2b1 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$PWD"
          elif [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name pubspec.yaml -print -quit | xargs -r dirname)"
          fi

          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Require pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f pubspec.lock ]; then
            echo "::error::pubspec.lock is missing. CI requires a committed lockfile."
            exit 1
          fi

          test -s pubspec.lock
          echo "pubspec.lock found:"
          ls -lh pubspec.lock

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter --version
          flutter pub get

          test -f pubspec.lock
          test -f .dart_tool/package_config.json

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          PROJECT_NAME="$(awk '/^name:/ {print $2; exit}' pubspec.yaml)"
          test -n "$PROJECT_NAME"

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name "$PROJECT_NAME" \
              --org com.example.musicplayer \
              .
          fi

          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            if [ -f android/gradle/wrapper/bootstrap-wrapper.sh ]; then
              chmod +x android/gradle/wrapper/bootstrap-wrapper.sh
              ./android/gradle/wrapper/bootstrap-wrapper.sh
            else
              echo "::error::gradle-wrapper.jar is missing and bootstrap-wrapper.sh is unavailable."
              exit 1
            fi
          fi

          test -f android/gradle/wrapper/gradle-wrapper.jar

          echo "Android platform:"
          ls -la android
          echo "Gradle wrapper:"
          ls -la android/gradle/wrapper

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -x android/gradlew
          chmod +x android/gradlew

          echo "Gradle wrapper properties:"
          cat android/gradle/wrapper/gradle-wrapper.properties

          echo "Gradle version:"
          cd android
          ./gradlew --version

      - name: Generate Isar / Dart code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter analyze --no-fatal-infos

      - name: Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter test

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk --debug

          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not produced."
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: v27-debug-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  release:
    name: Production Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ce94fb0c812a5d7a0b5f7c # v5
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@dded4c94c8c5c9c0b7c1d1c7e8f7e0e7b9d8f3d7 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55a5c8f7b5b4c8e0f5e5f0b3f8e5f8f4c0c2b1 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$PWD"
          elif [ -f "$GITHUB_WORKSPACE/pubspec.yaml" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name pubspec.yaml -print -quit | xargs -r dirname)"
          fi

          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/pubspec.yaml"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Require pubspec.lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -s pubspec.lock

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter pub get

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          chmod +x android/gradlew

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            if [ -f android/gradle/wrapper/bootstrap-wrapper.sh ]; then
              chmod +x android/gradle/wrapper/bootstrap-wrapper.sh
              ./android/gradle/wrapper/bootstrap-wrapper.sh
            else
              echo "::error::gradle-wrapper.jar is missing."
              exit 1
            fi
          fi

          test -f android/gradle/wrapper/gradle-wrapper.jar

      - name: Generate Isar / Dart code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          dart run build_runner build --delete-conflicting-outputs

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          TAG="${GITHUB_REF_NAME}"

          echo "Release tag: $TAG"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            echo "Expected format: vMAJOR.MINOR.PATCH"
            exit 1
          fi

          VERSION="$(awk -F': ' '/^version:/ {print $2; exit}' pubspec.yaml | cut -d'+' -f1)"

          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match pubspec version $VERSION"
            exit 1
          fi

          echo "Version check passed: $VERSION"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk --release

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK was not produced."
            find build -type f -name "*.apk" -print || true
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Build release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build appbundle --release

          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"

          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Release AAB was not produced."
            find build -type f -name "*.aab" -print || true
            exit 1
          fi

          ls -lh "$AAB_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: v27-release-apk-${{ github.ref_name }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: v27-release-aab-${{ github.ref_name }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
