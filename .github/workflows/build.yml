name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Flutter Android Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@c3d7ccbf814deadecbf6b21833020d5dc5c8eaf9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Locate Flutter project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "pubspec.yaml" ]; then
            PROJECT_DIR="$PWD"
          else
            FOUND="$(find . -type f -name pubspec.yaml -not -path './.git/*' -print -quit || true)"

            if [ -z "$FOUND" ]; then
              echo "::error::No Flutter project found."
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$FOUND")" && pwd)"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Verify committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f pubspec.lock ]; then
            echo "::error::pubspec.lock is missing."
            exit 1
          fi

          echo "pubspec.lock found."

      - name: Prepare Android platform
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          PROJECT_NAME="$(awk '/^name:/ {print $2; exit}' pubspec.yaml)
          test -n "$PROJECT_NAME"

          if [ ! -d android ]; then
            flutter create \
              --platforms=android \
              --project-name "$PROJECT_NAME" \
              --org com.example.musicplayer \
              .
          fi

          if [ ! -f android/gradlew ] ||
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            flutter create \
              --platforms=android \
              --project-name "$PROJECT_NAME" \
              --org com.example.musicplayer \
              .
          fi

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            if [ -f android/gradle/wrapper/bootstrap-wrapper.sh ]; then
              chmod +x android/gradle/wrapper/bootstrap-wrapper.sh
              ./android/gradle/wrapper/bootstrap-wrapper.sh
            else
              echo "::error::gradle-wrapper.jar is missing and bootstrap-wrapper.sh is unavailable."
              exit 1
            fi
          fi

          test -f android/gradle/wrapper/gradle-wrapper.jar

          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum -c -

      - name: Flutter pub get
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Generate Isar code
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter test

      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter build apk --debug --split-per-abi

      - name: Upload debug APKs
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v27-debug-apks
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    name: Signed Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@c3d7ccbf814deadecbf6b21833020d5dc5c8eaf9
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Verify release policy file
        shell: bash
        run: |
          set -euo pipefail

          test -f .github/RELEASE_TAG_PROTECTION.json || {
            echo "::error::Missing .github/RELEASE_TAG_PROTECTION.json"
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path(".github/RELEASE_TAG_PROTECTION.json").read_text()
          )

          assert data.get("target") == "tag"
          assert data.get("enforcement") == "active"

          include = (
              data.get("conditions", {})
                  .get("ref_name", {})
                  .get("include", [])
          )

          assert "refs/tags/v*" in include

          types = {
              rule.get("type")
              for rule in data.get("rules", [])
          }

          assert {"update", "deletion"} <= types
          PY

      - name: Verify active GitHub tag ruleset
        env:
          RELEASE_RULESET_TOKEN: ${{ secrets.RELEASE_RULESET_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$RELEASE_RULESET_TOKEN" || {
            echo "::error::RELEASE_RULESET_TOKEN secret is required."
            exit 1
          }

          export GH_TOKEN="$RELEASE_RULESET_TOKEN"

          ids="$(
            gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/rulesets?targets=tag&includes_parents=true&per_page=100" \
              --jq '.[].id'
          )"

          test -n "$ids" || {
            echo "::error::No GitHub tag rulesets are visible."
            exit 1
          }

          found=0

          while IFS= read -r rid; do
            [ -n "$rid" ] || continue

            detail="$(
              gh api \
                "/repos/${GITHUB_REPOSITORY}/rulesets/${rid}?includes_parents=true"
            )"

            export RULESET_DETAIL="$detail"

            if python3 - <<'PY'
          import json
          import os

          detail = json.loads(os.environ["RULESET_DETAIL"])

          if detail.get("target") != "tag":
              raise SystemExit(1)

          if detail.get("enforcement") != "active":
              raise SystemExit(1)

          ref_name = detail.get("conditions", {}).get("ref_name", {})

          if "refs/tags/v*" not in ref_name.get("include", []):
              raise SystemExit(1)

          if ref_name.get("exclude", []) != []:
              raise SystemExit(1)

          types = {
              rule.get("type")
              for rule in detail.get("rules", [])
          }

          if not {"update", "deletion"} <= types:
              raise SystemExit(1)

          if "bypass_actors" not in detail:
              raise SystemExit(2)

          bypass = detail.get("bypass_actors")

          if not isinstance(bypass, list):
              raise SystemExit(2)

          if bypass:
              raise SystemExit(2)

          raise SystemExit(0)
          PY
            then
              found=1
              break
            else
              rc=$?

              if [ "$rc" -eq 2 ]; then
                echo "::error::Release-tag ruleset has bypass actors."
                exit 1
              fi
            fi

          done <<< "$ids"

          [ "$found" -eq 1 ] || {
            echo "::error::No active immutable v* tag ruleset found."
            exit 1
          }

          echo "Active immutable release-tag ruleset verified."

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(
            awk '/^version:/ {print $2; exit}' pubspec.yaml
          )"

          if [[ "$APP_VERSION" != *+* ]]; then
            echo "::error::pubspec.yaml version must be versionName+versionCode."
            exit 1
          fi

          APP_VERSION_NAME="${APP_VERSION%%+*}"
          APP_VERSION_CODE="${APP_VERSION##*+}"

          if [ "$TAG_VERSION" != "$APP_VERSION_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $APP_VERSION_NAME."
            exit 1
          fi

          if ! [[ "$APP_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::versionCode must be numeric."
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::GitHub Release already exists for $GITHUB_REF_NAME."
            exit 1
          fi

          echo "Release version validated: $GITHUB_REF_NAME -> $APP_VERSION"

      - name: Prepare Android
        shell: bash
        run: |
          set -euo pipefail

          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            if [ -f android/gradle/wrapper/bootstrap-wrapper.sh ]; then
              chmod +x android/gradle/wrapper/bootstrap-wrapper.sh
              ./android/gradle/wrapper/bootstrap-wrapper.sh
            else
              echo "::error::Missing gradle-wrapper.jar and bootstrap script."
              exit 1
            fi
          fi

          test -f android/gradle/wrapper/gradle-wrapper.jar

          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum -c -

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Isar code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

          cat > android/key.properties <<EOF
          storeFile=release-key.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 android/release-key.jks android/key.properties

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Create GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab

      - name: Remove release signing material
        if: always()
        shell: bash
        run: |
          rm -f android/release-key.jks
          rm -f android/key.properties
