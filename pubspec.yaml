name: offline_music_player
description: A high-performance, offline-first music player for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.44.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: 2.5.1
  # Local reactive DB
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2
  path_provider: 2.1.3
  # Permissions
  permission_handler: 11.3.1
  # Monetization — deferred until a future connected release; see
  # lib/ads_iap/README.md. Re-add google_mobile_ads / in_app_purchase
  # (and restore INTERNET / BILLING permissions in the manifest) then.

  # Utilities
  shared_preferences: 2.2.3
  equatable: 2.0.5
  cupertino_icons: 1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  build_runner: 2.7.2
  isar_community_generator: 3.3.2
flutter:
  uses-material-design: true
  assets:
    - assets/icon/
