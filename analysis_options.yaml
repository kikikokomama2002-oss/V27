include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated by `dart run build_runner build` (Isar's track.g.dart and
    # any future generated sources) — not hand-written, so it shouldn't
    # be linted, and it's fine (expected) for it to not exist yet before
    # the first codegen run.
    - "**/*.g.dart"

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
